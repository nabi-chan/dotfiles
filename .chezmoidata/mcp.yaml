mcp_servers:
  chrome-devtools:
    command: chrome-devtools-mcp
    args: [--slim, --headless]
  dbhub:
    command: dbhub
    args: [--config, ~/.config/dbhub/config.toml]
  rea:
    command: rea
    args: [mcp]
  # 법제처 API 키는 공개 저장소에 두지 않고 ~/.zshrc.local 의 LAW_OC 로 받음
  korean-law:
    command: korean-law-mcp
    args: []

codex_mcp_servers:
  context7:
    url: https://mcp.context7.com/mcp
  # Codex 기본 타임아웃(시작 10초, 호출 60초)은 rea 분석에 짧아서 rea setup 권장값으로 덮어씀
  rea:
    command: rea
    args: [mcp]
    startup_timeout_sec: 30
    tool_timeout_sec: 450
  # Codex는 MCP 서버에 기본 환경변수만 넘기므로 LAW_OC 를 명시적으로 전달
  korean-law:
    command: korean-law-mcp
    env_vars: [LAW_OC]
  openaiDeveloperDocs:
    url: https://developers.openai.com/mcp

opencode_mcp_servers:
  context7:
    url: https://mcp.context7.com/mcp

antigravity_mcp_servers:
  context7:
    url: https://mcp.context7.com/mcp
